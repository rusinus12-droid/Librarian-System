# Run in the package root (the folder that holds PROGRAM and DATA):
#   docker compose -f PROGRAM/docker/compose.yaml up -d --build
# Plugins on this PC connect to http://127.0.0.1:47630 without a key. The access key (first start log)
# is only for clients outside the local network.
services:
  librarian:
    build:
      context: ../..
      dockerfile: PROGRAM/docker/Dockerfile
    image: librarian-system:local
    init: true
    restart: unless-stopped
    ports:
      # Only this PC can reach the server.
      - "127.0.0.1:47630:47630"
    volumes:
      - librarian-data:/librarian/DATA
volumes:
  librarian-data:
