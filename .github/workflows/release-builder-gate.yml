name: Release Builder Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-builder-gate:
    name: release-builder-gate
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run release builder publication gate
        run: |
          mkdir -p "$RUNNER_TEMP/librarian-release"
          node PROGRAM/tools/build_distribution.cjs \
            --profile release \
            --qualification publication_gate \
            --check \
            --output-dir "$RUNNER_TEMP/librarian-release"

      - name: Verify build report publication contract
        run: |
          node -e '
          const fs = require("node:fs");
          const path = require("node:path");

          const outDir = process.env.RUNNER_TEMP + "/librarian-release";
          const files = fs.readdirSync(outDir).filter(f => f.endsWith(".build-report.json"));
          if (files.length === 0) {
            console.error("No .build-report.json found in output directory");
            process.exit(1);
          }
          const reportPath = path.join(outDir, files[0]);
          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));

          const required = {
            schema: "librarian-system.distribution-build-report.v1",
            profile: "release",
            qualification: "publication_gate",
            publicationSmokePassed: true,
            updaterEligible: true,
            sourceUnchangedVerified: true,
            sourceDataReadOrCopied: false,
            embeddedRuntime: false,
            privateDataPatternsRejected: true,
            unixExecutePermissionsVerified: true,
            utf8EntryNamesVerified: true,
            testsRun: true,
            testProfile: "release_smoke",
            fullRegressionRunByBuilder: false,
            fullRegressionRequiredBeforePublication: true
          };

          let mismatch = false;
          for (const [key, val] of Object.entries(required)) {
            if (report[key] !== val) {
              console.error(`Build report field mismatch: ${key} = ${report[key]} (expected ${val})`);
              mismatch = true;
            }
          }
          if (mismatch) process.exit(1);
          console.log("Build report publication contract verified successfully.");
          '

      - name: Verify clean working tree
        run: |
          STATUS=$(git status --porcelain)
          if [ -n "$STATUS" ]; then
            echo "Working tree is dirty after release build:"
            echo "$STATUS"
            git diff
            exit 1
          fi
          echo "Working tree is completely clean."

      - name: Upload release build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: librarian-release-artifacts
          path: |
            ${{ runner.temp }}/librarian-release/*.zip
            ${{ runner.temp }}/librarian-release/*.build-report.json
            ${{ runner.temp }}/librarian-release/*.GITHUB_RELEASE_INFO.txt
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: librarian-release-failure-reports
          path: |
            ${{ runner.temp }}/librarian-release/*.failed-*.json
            ${{ runner.temp }}/librarian-release/*.build-report.json
          if-no-files-found: ignore

  main-release:
    name: main-release
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: librarian-main-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned build dependencies
        run: npm ci --prefix PROGRAM/build-support

      - name: Resolve release transaction state
        id: state
        run: |
          git fetch origin main --tags
          git checkout --detach "$GITHUB_SHA"
          node -e '
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");
          const { determineReleaseState, findReleaseCommitForEvent } = require("./PROGRAM/tools/release_transaction.cjs");
          const { nextPatchVersion } = require("./PROGRAM/tools/release_version.cjs");
          const eventSha = process.env.GITHUB_SHA;
          const commits = execFileSync("git", [
            "log", "origin/main", "--format=%H%x00%P%x00%s"
          ], { encoding: "utf8" }).trim().split("\n").filter(Boolean).map(line => {
            const [sha, parents, subject] = line.split("\0");
            return { sha, parents: parents ? parents.split(" ") : [], subject };
          });
          const transaction = findReleaseCommitForEvent(commits, eventSha);
          const checkoutSha = transaction ? transaction.sha : "origin/main";
          execFileSync("git", ["checkout", "--detach", checkoutSha], { stdio: "inherit" });
          const currentVersion = fs.readFileSync("PROGRAM/VERSION.txt", "utf8").trim();
          const headSubject = execFileSync("git", ["log", "-1", "--pretty=%s"], { encoding: "utf8" }).trim();
          const parentVersion = headSubject.startsWith("chore(release):")
            ? execFileSync("git", ["show", "HEAD^:PROGRAM/VERSION.txt"], { encoding: "utf8" }).trim()
            : null;
          const state = determineReleaseState({ headSubject, currentVersion, parentVersion });
          const targetVersion = state.targetVersion || nextPatchVersion(currentVersion);
          const previousVersion = state.previousVersion || currentVersion;
          const commit = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          console.log(JSON.stringify({ ...state, targetVersion, previousVersion, commit, eventSha, transactionSha: transaction?.sha || null }));
          fs.appendFileSync(process.env.GITHUB_ENV,
            `CURRENT_VERSION=${currentVersion}\nPREVIOUS_VERSION=${previousVersion}\nNEXT_VERSION=${targetVersion}\n` +
            `RELEASE_COMMIT_SHA=${commit}\nRELEASE_PHASE=${state.phase}\nEVENT_SHA=${eventSha}\n` +
            `LIBRARIAN_RELEASE_BUILD_ID=release-${eventSha.slice(0, 40)}\n` +
            `LIBRARIAN_RELEASE_GENERATED_AT=${execFileSync("git", ["show", "-s", "--format=%cI", eventSha], { encoding: "utf8" }).trim()}\n`);
          '

      - name: Guard against duplicate version transaction
        if: env.RELEASE_PHASE == 'prepare'
        run: |
          if git rev-parse -q --verify "refs/tags/v${NEXT_VERSION}" >/dev/null; then
            echo "Error: Tag v${NEXT_VERSION} already exists. Aborting release without modification."
            exit 1
          fi
          echo "Tag v${NEXT_VERSION} is unique and available."

      - name: Run release builder with patch version bump
        run: |
          mkdir -p "$RUNNER_TEMP/librarian-release"
          args=(--profile release --qualification publication_gate --output-dir "$RUNNER_TEMP/librarian-release")
          if [[ "$RELEASE_PHASE" == "prepare" ]]; then
            args+=(--version "$NEXT_VERSION")
          fi
          node PROGRAM/tools/build_distribution.cjs "${args[@]}"

      - name: Verify build report publication contract
        run: |
          node -e '
          const fs = require("node:fs");
          const path = require("node:path");

          const outDir = process.env.RUNNER_TEMP + "/librarian-release";
          const files = fs.readdirSync(outDir).filter(f => f.endsWith(".build-report.json"));
          if (files.length === 0) {
            console.error("No .build-report.json found in output directory");
            process.exit(1);
          }
          const reportPath = path.join(outDir, files[0]);
          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));

          const required = {
            schema: "librarian-system.distribution-build-report.v1",
            profile: "release",
            qualification: "publication_gate",
            publicationSmokePassed: true,
            updaterEligible: true,
            sourceUnchangedVerified: true,
            sourceDataReadOrCopied: false,
            embeddedRuntime: false,
            privateDataPatternsRejected: true,
            unixExecutePermissionsVerified: true,
            utf8EntryNamesVerified: true,
            testsRun: true,
            testProfile: "release_smoke",
            fullRegressionRunByBuilder: false,
            fullRegressionRequiredBeforePublication: true
          };

          let mismatch = false;
          for (const [key, val] of Object.entries(required)) {
            if (report[key] !== val) {
              console.error(`Build report field mismatch: ${key} = ${report[key]} (expected ${val})`);
              mismatch = true;
            }
          }
          if (mismatch) process.exit(1);
          console.log("Build report publication contract verified successfully.");
          '

      - name: Verify version transaction changes against contract
        if: env.RELEASE_PHASE == 'prepare'
        run: |
          node -e '
          const fs = require("node:fs");
          const { execSync } = require("node:child_process");
          const { VERSION_TRANSACTION_RELATIVE_FILES } = require("./PROGRAM/tools/build_distribution.cjs");

          const status = execSync("git status --porcelain", { encoding: "utf8" }).trim();
          if (!status) {
            console.error("No file modifications found after version bump");
            process.exit(1);
          }

          const allowed = new Set(VERSION_TRANSACTION_RELATIVE_FILES);
          const lines = status.split("\n").filter(Boolean);
          for (const line of lines) {
            const file = line.slice(3).trim();
            if (!allowed.has(file)) {
              console.error(`Disallowed file modified outside VERSION_TRANSACTION_RELATIVE_FILES: ${file}`);
              process.exit(1);
            }
          }

          const newVersion = fs.readFileSync("PROGRAM/VERSION.txt", "utf8").trim();
          if (newVersion !== process.env.NEXT_VERSION) {
            console.error(`PROGRAM/VERSION.txt (${newVersion}) != NEXT_VERSION (${process.env.NEXT_VERSION})`);
            process.exit(1);
          }
          console.log("All modified files strictly match VERSION_TRANSACTION_RELATIVE_FILES contract.");
          '

      - name: Run required release regressions
        id: regressions
        run: |
          node --test \
            PROGRAM/tests/release_transaction_test.cjs \
            PROGRAM/tests/release_builder_profiles_test.cjs \
            PROGRAM/tests/release_builder_qualification_runtime_test.cjs \
            PROGRAM/tests/release_builder_version_input_test.cjs \
            PROGRAM/tests/gradia/native-host-id-binding.test.cjs \
            PROGRAM/tests/gradia/server-read-adapter.test.cjs \
            PROGRAM/tests/distribution_updater_migration_file_test.cjs \
            PROGRAM/tests/remote_update_release_zip_runtime_test.cjs

      - name: Commit release version
        if: env.RELEASE_PHASE == 'prepare'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node -e '
          const { execSync } = require("node:child_process");
          const { VERSION_TRANSACTION_RELATIVE_FILES } = require("./PROGRAM/tools/build_distribution.cjs");
          for (const f of VERSION_TRANSACTION_RELATIVE_FILES) {
            execSync(`git add "${f}"`);
          }
          '
          git commit -m "chore(release): v${NEXT_VERSION}"
          RELEASE_COMMIT_SHA=$(git rev-parse HEAD)
          echo "RELEASE_COMMIT_SHA=$RELEASE_COMMIT_SHA" >> "$GITHUB_ENV"

      - name: Push release commit to main
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$RELEASE_COMMIT_SHA" origin/main; then
            echo "Release commit ${RELEASE_COMMIT_SHA} is already present on origin/main."
          else
            git push origin "HEAD:main"
          fi

      - name: Create or reuse release tag
        id: tag
        run: |
          TAG="v${NEXT_VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_SHA=$(git rev-list -n 1 "${TAG}")
            if [[ "$TAG_SHA" != "$RELEASE_COMMIT_SHA" ]]; then
              echo "Tag ${TAG} points to ${TAG_SHA}, expected ${RELEASE_COMMIT_SHA}."
              exit 1
            fi
            echo "Reusing existing tag ${TAG}."
          else
            git tag "${TAG}" "$RELEASE_COMMIT_SHA"
            git push origin "${TAG}"
            echo "Created and pushed tag ${TAG}."
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify release artifact integrity
        run: |
          node -e '
          const fs = require("node:fs");
          const path = require("node:path");
          const outDir = process.env.RUNNER_TEMP + "/librarian-release";
          const reportPath = fs.readdirSync(outDir).find(f => f.endsWith(".build-report.json"));
          if (!reportPath) throw new Error("release_build_report_missing");
          const report = JSON.parse(fs.readFileSync(path.join(outDir, reportPath), "utf8"));
          if (report.packageVersion !== process.env.NEXT_VERSION || report.releaseTag !== `v${process.env.NEXT_VERSION}`) {
            throw new Error(`release_artifact_version_mismatch:${report.packageVersion}:${report.releaseTag}`);
          }
          const asset = path.join(outDir, `Librarian-System-${process.env.NEXT_VERSION}.zip`);
          if (!fs.existsSync(asset) || fs.statSync(asset).size === 0) throw new Error("release_asset_missing_or_empty");
          console.log(`Verified ${path.basename(asset)} (${fs.statSync(asset).size} bytes).`);
          '

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: github-release
        run: |
          ASSETS=()
          for f in "$RUNNER_TEMP/librarian-release"/*.zip \
                   "$RUNNER_TEMP/librarian-release"/*.build-report.json \
                   "$RUNNER_TEMP/librarian-release"/*.GITHUB_RELEASE_INFO.txt; do
            if [ -f "$f" ]; then
              ASSETS+=("$f")
            fi
          done

          TAG="v${NEXT_VERSION}"
          if gh release view "$TAG" --json tagName,url,assets >/tmp/librarian-release.json 2>/dev/null; then
            RELEASE_URL=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("/tmp/librarian-release.json", "utf8")).url)')
            RELEASE_TAG=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("/tmp/librarian-release.json", "utf8")).tagName)')
            [[ "$RELEASE_TAG" == "$TAG" ]] || {
              echo "Existing GitHub Release has unexpected tag ${RELEASE_TAG}."
              exit 1
            }
            missing=()
            for f in "${ASSETS[@]}"; do
              name=$(basename "$f")
              exists=$(node -e '
                const release = JSON.parse(require("fs").readFileSync("/tmp/librarian-release.json", "utf8"));
                const name = process.argv[1];
                process.stdout.write((release.assets || []).some(asset => asset.name === name) ? "true" : "false");
              ' "$name")
              if [[ "$exists" == "true" ]]; then
                if ! gh release download "$TAG" --pattern "$name" --dir "$RUNNER_TEMP/librarian-release-existing" --clobber >/dev/null 2>&1; then
                  echo "Existing asset ${name} is listed but could not be downloaded; refusing to treat an API or permission failure as a missing asset."
                  exit 1
                fi
                existing="$RUNNER_TEMP/librarian-release-existing/$name"
                expected=$(sha256sum "$f" | cut -d' ' -f1)
                actual=$(sha256sum "$existing" | cut -d' ' -f1)
                if [[ "$expected" != "$actual" ]]; then
                  echo "Existing asset ${name} has a different SHA-256 (${actual}, expected ${expected})."
                  exit 1
                fi
              else
                missing+=("$f")
              fi
            done
            if ((${#missing[@]} > 0)); then
              gh release upload "$TAG" "${missing[@]}"
              echo "Uploaded ${#missing[@]} missing asset(s) to ${RELEASE_URL}."
            else
              echo "Reusing complete GitHub Release ${RELEASE_URL}."
            fi
          else
            RELEASE_URL=$(gh release create "$TAG" \
              "${ASSETS[@]}" \
              --title "Librarian System v${NEXT_VERSION}" \
              --generate-notes)
          fi
          echo "url=${RELEASE_URL}" >> "$GITHUB_OUTPUT"

      - name: Upload release build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: librarian-release-v${{ env.NEXT_VERSION }}
          path: |
            ${{ runner.temp }}/librarian-release/*.zip
            ${{ runner.temp }}/librarian-release/*.build-report.json
            ${{ runner.temp }}/librarian-release/*.GITHUB_RELEASE_INFO.txt
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: librarian-main-release-failure-reports
          path: |
            ${{ runner.temp }}/librarian-release/*.failed-*.json
            ${{ runner.temp }}/librarian-release/*.build-report.json
          if-no-files-found: ignore

      - name: Write release job summary
        if: always()
        env:
          RELEASE_URL: ${{ steps.github-release.outputs.url }}
          TAG_NAME: ${{ steps.tag.outputs.tag }}
          REGRESSION_OUTCOME: ${{ steps.regressions.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Librarian System release"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Previous version | \`${PREVIOUS_VERSION:-unknown}\` |"
            echo "| New version | \`${NEXT_VERSION:-unknown}\` |"
            echo "| Release phase | \`${RELEASE_PHASE:-unknown}\` |"
            echo "| Target commit | \`${RELEASE_COMMIT_SHA:-unknown}\` |"
            echo "| Build validation | \`${JOB_STATUS}\` |"
            echo "| Required regressions | \`${REGRESSION_OUTCOME:-not-run}\` |"
            echo "| Tag | \`${TAG_NAME:-not-created}\` |"
            echo "| GitHub Release | ${RELEASE_URL:-not-created} |"
            echo ""
            echo "### Recovery"
            echo "Rerun this workflow for the same main push. A pushed release commit resumes the existing version; matching tags and Releases are reused. A tag collision or permission failure is reported without force-pushing or disabling branch protection."
          } >> "$GITHUB_STEP_SUMMARY"
