name: Release Builder Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-builder-gate:
    name: release-builder-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned build dependencies
        run: npm ci --prefix PROGRAM/build-support

      - name: Run release builder publication gate
        run: |
          mkdir -p "$RUNNER_TEMP/librarian-release"
          node PROGRAM/tools/build_distribution.cjs \
            --profile release \
            --qualification publication_gate \
            --check \
            --output-dir "$RUNNER_TEMP/librarian-release"

      - name: Verify build report publication contract
        run: |
          node -e '
          const fs = require("node:fs");
          const path = require("node:path");

          const outDir = process.env.RUNNER_TEMP + "/librarian-release";
          const files = fs.readdirSync(outDir).filter(f => f.endsWith(".build-report.json"));
          if (files.length === 0) {
            console.error("No .build-report.json found in output directory");
            process.exit(1);
          }
          const reportPath = path.join(outDir, files[0]);
          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));

          const required = {
            schema: "librarian-system.distribution-build-report.v1",
            profile: "release",
            qualification: "publication_gate",
            publicationSmokePassed: true,
            updaterEligible: true,
            sourceUnchangedVerified: true,
            sourceDataReadOrCopied: false,
            embeddedRuntime: false,
            privateDataPatternsRejected: true,
            unixExecutePermissionsVerified: true,
            utf8EntryNamesVerified: true,
            testsRun: true,
            testProfile: "release_smoke",
            fullRegressionRunByBuilder: false,
            fullRegressionRequiredBeforePublication: true
          };

          let mismatch = false;
          for (const [key, val] of Object.entries(required)) {
            if (report[key] !== val) {
              console.error(`Build report field mismatch: ${key} = ${report[key]} (expected ${val})`);
              mismatch = true;
            }
          }
          const roundTrip = report.storageModeRoundTrip;
          if (roundTrip?.passed !== true || ["libra", "hayaku", "flashback"].some(owner =>
            !report.pluginSha256?.[owner] || roundTrip.plugins?.[owner] !== report.pluginSha256[owner]
          )) {
            console.error("Missing storage mode round-trip verification for the packaged plugins.");
            mismatch = true;
          }
          const { PLUGINS } = require("./PROGRAM/tools/release_metadata.cjs");
          for (const owner of Object.keys(PLUGINS)) {
            if (!report.pluginSha256?.[owner]) {
              console.error(`Missing pluginSha256 entry for ${owner}`);
              mismatch = true;
            }
          }
          if (!report.packageVersion || report.releaseTag !== `v${report.packageVersion}`) {
            console.error(`Invalid packageVersion/releaseTag: ${report.packageVersion} / ${report.releaseTag}`);
            mismatch = true;
          }
          if (mismatch) process.exit(1);
          console.log("Build report publication contract verified successfully.");
          '

      - name: Run current plugin feature and fix regressions
        env:
          NODE_PATH: ${{ github.workspace }}/PROGRAM/build-support/node_modules
        run: |
          node --test --test-concurrency=2 \
            PROGRAM/tests/gradia_forced_bond_aide_test.cjs \
            PROGRAM/tests/gradia_body_state_aide_test.cjs \
            PROGRAM/tests/gradia_world_dynamics_aide_test.cjs \
            PROGRAM/tests/gradia_intimacy_aide_test.cjs \
            PROGRAM/tests/gradia_relationship_sim_aide_test.cjs \
            PROGRAM/tests/gradia_group_card_cast_test.cjs \
            PROGRAM/tests/gradia_gui_scope_pages_test.cjs \
            PROGRAM/tests/gradia_profile_initiative_test.cjs \
            PROGRAM/tests/gradia_rp_pacing_prompt_test.cjs \
            PROGRAM/tests/gradia_present_profile_lore_test.cjs \
            PROGRAM/tests/gradia_scene_fixation_test.cjs \
            PROGRAM/tests/gradia_npc_disposition_test.cjs \
            PROGRAM/tests/hayaku_missed_after_request_canonical_packet_test.cjs \
            PROGRAM/tests/libra_main_after_request_proof_revision_test.cjs \
            PROGRAM/tests/libra_micro_claim_changed_retry_test.cjs \
            PROGRAM/tests/libra_micro_not_durably_ready_retry_test.cjs \
            PROGRAM/tests/libra_micro_timeout_and_schema_recovery_test.cjs \
            PROGRAM/tests/libra_text_equivalent_revision_test.cjs \
            PROGRAM/tests/libra_last_micro_publication_order_test.cjs \
            PROGRAM/tests/gradia/context-degradation.test.cjs \
            PROGRAM/tests/gradia/author-note-all-stages.test.cjs \
            PROGRAM/tests/gradia/creative-direction-clear.test.cjs \
            PROGRAM/tests/gradia_three_owner_pipeline_test.cjs \
            PROGRAM/tests/gradia/evidence-bridge.test.cjs \
            PROGRAM/tests/gradia_optional_memory_runtime_test.cjs \
            PROGRAM/tests/gradia_input_writer_unified_runtime_test.cjs \
            PROGRAM/tests/gradia_owner_handback_test.cjs \
            PROGRAM/tests/gradia_plugin_mode_long_chat_test.cjs \
            PROGRAM/tests/gradia_plugin_read_test.cjs \
            PROGRAM/tests/gradia_three_owner_allocation_test.cjs \
            PROGRAM/tests/source_input_tag_finder_test.cjs \
            PROGRAM/tests/source_rule_sync_preview_test.cjs \
            PROGRAM/tests/source_rule_sync_real_ipc_test.cjs \
            PROGRAM/tests/memory_suite_recall_share_test.cjs \
            PROGRAM/tests/flashback_state_line_bookkeeping_free_test.cjs \
            PROGRAM/tests/flashback_source_rule_change_maintenance_test.cjs \
            PROGRAM/tests/gradia_object_continuity_test.cjs \
            PROGRAM/tests/libra_cycle_lens_pregnancy_runtime_test.cjs \
            PROGRAM/tests/gradia_live_eval_regressions_test.cjs \
            PROGRAM/tests/lia_settings_save_in_place_test.cjs \
            PROGRAM/tests/hayaku_storage_read_coalescing_test.cjs \
            PROGRAM/tests/hayaku_read_scope_reuse_test.cjs \
            PROGRAM/tests/hayaku_review_hardening_runtime_test.cjs \
            PROGRAM/tests/flashback_chat_output_live_confirmation_runtime_test.cjs \
            PROGRAM/tests/flashback_chat_output_unload_microtask_recovery_test.cjs \
            PROGRAM/tests/flashback_copy_observer_host_read_test.cjs \
            PROGRAM/tests/native_branch_flashback_real_character_test.cjs \
            PROGRAM/tests/native_chat_copy_turn_binding_test.cjs \
            PROGRAM/tests/compute_gui_and_libra_open_latency_contract_test.cjs \
            PROGRAM/tests/libra_micro_unproven_diagnostic_test.cjs \
            PROGRAM/tests/libra_narrative_event_projection_runtime_test.cjs \
            PROGRAM/tests/libra_story_clock_accumulation_runtime_test.cjs \
            PROGRAM/tests/libra_story_clock_gradia_read_test.cjs \
            PROGRAM/tests/gradia_scene_variance_test.cjs \
            PROGRAM/tests/libra_scope_switch_memory_gaps_test.cjs \
            PROGRAM/tests/libra_lens_memory_edit_runtime_test.cjs \
            PROGRAM/tests/libra_lens_excluded_reader_runtime_test.cjs \
            PROGRAM/tests/libra_receipt_validation_host_read_test.cjs

      - name: Verify clean working tree
        run: |
          STATUS=$(git status --porcelain)
          if [ -n "$STATUS" ]; then
            echo "Working tree is dirty after release build:"
            echo "$STATUS"
            git diff
            exit 1
          fi
          echo "Working tree is completely clean."

      - name: Upload release build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: librarian-release-artifacts
          path: |
            ${{ runner.temp }}/librarian-release/*.zip
            ${{ runner.temp }}/librarian-release/*.build-report.json
            ${{ runner.temp }}/librarian-release/*.GITHUB_RELEASE_INFO.txt
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: librarian-release-failure-reports
          path: |
            ${{ runner.temp }}/librarian-release/*.failed-*.json
            ${{ runner.temp }}/librarian-release/*.build-report.json
          if-no-files-found: ignore
