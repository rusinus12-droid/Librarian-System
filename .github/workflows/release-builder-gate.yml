            PROGRAM/tests/unified_release_gate_v1_test.cjs \
            PROGRAM/tests/release_transaction_test.cjs \
            PROGRAM/tests/release_builder_qualification_runtime_test.cjs \
            PROGRAM/tests/distribution_updater_migration_file_test.cjs \
            PROGRAM/tests/remote_update_release_zip_runtime_test.cjs
          node PROGRAM/tests/release_reproducibility_test.cjs

      - name: Verify clean working tree
        run: |
          STATUS=$(git status --porcelain)
          if [ -n "$STATUS" ]; then
            echo "Working tree is dirty after release build:"
            echo "$STATUS"
            git diff
            exit 1
          fi
          echo "Working tree is completely clean."

      - name: Upload release build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: librarian-release-artifacts
          path: |
            ${{ runner.temp }}/librarian-release/*.zip
            ${{ runner.temp }}/librarian-release/*.build-report.json
            ${{ runner.temp }}/librarian-release/*.GITHUB_RELEASE_INFO.txt
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: librarian-release-failure-reports
          path: |
            ${{ runner.temp }}/librarian-release/*.failed-*.json
            ${{ runner.temp }}/librarian-release/*.build-report.json
          if-no-files-found: ignore

  windows-smoke:
    name: windows-smoke
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: PROGRAM/build-support/package-lock.json

      - name: Install pinned build dependencies
        run: npm ci --prefix PROGRAM/build-support

      - name: Run Windows launcher and contract smoke tests
        shell: bash
        env:
          NODE_PATH: ${{ github.workspace }}/PROGRAM/build-support/node_modules
        run: |
          node --test \
            PROGRAM/tests/windows_bootstrap_contract_test.cjs \
            PROGRAM/tests/remote_update_launchers_contract_test.cjs \
            PROGRAM/tests/updater_user_experience_test.cjs \
            PROGRAM/tests/program_data_layout_test.cjs \
            PROGRAM/tests/audit_stage5_residual_hardening_test.cjs \
            PROGRAM/tests/audit_stage7_updater_remote_and_large_transfer_test.cjs
